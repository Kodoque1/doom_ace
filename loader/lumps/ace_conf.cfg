// ACE Engine mod config for the matryoshka verification WAD.
//
// This WAD is a minimal ACE carrier: it ships a crafted PNAMES/TEXTURE1 to get
// ACE resident and has no DEHACKED, so the engine's texture step refuses it
// ("Rename PNAMES using DEHACKED!"). doomtex.workaround invalidates the
// conflicting lumps so the originals from doom2.wad are found instead - which is
// what lets this build reach the game loop, and therefore the per-frame yield
// point where the nested-instance switch is serviced.
//
// NOTE ON SOUND: `sound.device.sfx` was tried HERE and does not work - measured,
// `snd_sfxdevice` stayed 0 with the key in this file, because ACE's config only
// fills that value in when Doom's own is zero (`config.c`) and Doom's is what
// `S_Init` reads. Doom's own `default.cfg` is what reaches it; see
// verify/record.sh (MTX_SOUND) and verify/NEXT.md. So it is deliberately NOT
// declared here: a config key that does nothing is worse than no key.
doomtex.workaround	1
